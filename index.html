    /* =====================================================================
       11. EVENT FORM (create / edit / approve)
       ===================================================================== */
    function openEventForm({ event = null, prefill = null, origin = null, publishOnSave = false } = {}) {
      const data = event || prefill || { mode: 'offline', state: state.settings.homeState, offlineCounts: { teams: 0, students: 0 } };
      const title = event ? 'Edit event' : origin ? 'Review and publish event' : 'Add event';
      const body = `
        <form id="event-form" data-form="event" data-id="${esc(event?.id || '')}" data-publish="${publishOnSave ? '1' : ''}" data-origin="${esc(origin ? `${origin.type}:${origin.id}` : '')}" novalidate>
          <div class="form-grid">${EVENT_FIELDS.map((f) => renderField(f, data)).join('')}</div>
          ${dataLists()}
          <p class="form-error" id="event-form-error"></p>
        </form>`;
      const footer = `
        <button class="btn" data-action="close-modal">Cancel</button>
        <button class="btn btn-primary" type="submit" form="event-form">${event && !publishOnSave ? 'Save changes' : 'Publish event'}</button>`;
      modal.open(modalShell({ title, body, footer }), { size: 'wide' });
    }

    function validateEvent(data) {
      if (!data.name) return 'Event name is required.';
      if (!data.startDate) return 'Event start date is required.';
      if (data.endDate && data.endDate < data.startDate) return 'Event end date cannot be before the start date.';
      if (data.registrationUrl && !safeUrl(data.registrationUrl)) return 'Registration link must start with http:// or https://';
      if (data.imageUrl && !safeUrl(data.imageUrl)) return 'Image URL must start with http:// or https://';
      if (data.teamSizeMin && data.teamSizeMax && data.teamSizeMin > data.teamSizeMax) return 'Min team size is larger than max team size.';
      return '';
    }

    async function submitEventForm(form) {
      const data = readFields(form, EVENT_FIELDS);
      data.endDate = data.endDate || data.startDate;
      data.offlineCounts = { teams: data.offlineCounts?.teams ?? 0, students: data.offlineCounts?.students ?? 0 };
      const error = validateEvent(data);
      $('#event-form-error').textContent = error;
      if (error) {
        $('#event-form-error').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return;
      }

      const id = form.dataset.id;
      const [originType, originId] = (form.dataset.origin || '').split(':');

      const ok = await runAction(async () => {
        if (id) {
          // manualOverride stops the daily importer from overwriting staff corrections.
          const publish = form.dataset.publish === '1' ? { visibility: 'published', needsReview: false, reviewNote: '' } : {};
          await updateDoc(doc(db, COL.events, id), stamp({ ...data, manualOverride: true, ...publish }));
          return;
        }
        const batch = writeBatch(db);
        const ref = doc(collection(db, COL.events));
        batch.set(ref, created({ ...data, source: originType || 'manual', visibility: 'published', manualOverride: true }));
        if (originType === 'suggestion') {
          batch.update(doc(db, COL.suggestions, originId), stamp({ status: 'approved', eventId: ref.id }));
        }
        await batch.commit();
      }, id && form.dataset.publish !== '1' ? 'Event updated.' : 'Event published.');
      if (ok) modal.close();
    }

    async function deleteEvent(id) {
      const event = state.events.find((e) => e.id === id);
      const teamCount = state.teams.filter((t) => t.eventId === id).length;
      const confirmed = await confirmDialog({
        title: 'Delete this event?',
        text: `"${event?.name}" will be removed${teamCount ? ` along with ${plural(teamCount, 'team registration')}` : ''}. This cannot be undone.`,
        confirmLabel: 'Delete event',
        danger: true,
      });
      if (!confirmed) return;
      const ok = await runAction(async () => {
        const batch = writeBatch(db);
        state.teams.filter((t) => t.eventId === id).forEach((t) => batch.delete(doc(db, COL.teams, t.id)));
        batch.delete(doc(db, COL.events, id));
        await batch.commit();
      }, 'Event deleted.');
      if (ok) modal.close();
    }

    function removeButton(e) {
      // Imported events would come back on the next import if deleted, so they are hidden instead.
      if (isImported(e)) {
        return e.visibility === 'hidden'
          ? `<button class="btn btn-sm" data-action="set-visibility" data-visibility="published" data-id="${esc(e.id)}">Unhide</button>`
          : `<button class="btn btn-sm btn-danger" data-action="set-visibility" data-visibility="hidden" data-id="${esc(e.id)}">Hide</button>`;
      }
      return `<button class="btn btn-sm btn-danger icon-btn" data-action="delete-event" data-id="${esc(e.id)}" aria-label="Delete" title="Delete">${icon('trash')}</button>`;
    }

    async function setVisibility(ids, visibility) {
      const messages = { published: 'Published.', hidden: 'Hidden from students.', pending: 'Moved to approvals.' };
      const ok = await runAction(async () => {
        for (let i = 0; i < ids.length; i += 400) {
          const batch = writeBatch(db);
          ids.slice(i, i + 400).forEach((id) => batch.update(doc(db, COL.events, id), stamp({ visibility })));
          await batch.commit();
        }
      }, ids.length > 1 ? `${ids.length} events ${messages[visibility].toLowerCase()}` : messages[visibility]);
      if (ok && ids.length === 1) modal.close();
    }

    async function publishAllPending() {
      const ids = pendingImports().filter((e) => !e.needsReview).map((e) => e.id);
      if (!ids.length) return;
      const confirmed = await confirmDialog({
        title: `Publish ${ids.length} imported events?`,
        text: 'Students will see them immediately. Events that need review (e.g. missing location) are left for you to edit first.',
        confirmLabel: 'Publish all',
      });
      if (confirmed) await setVisibility(ids, 'published');
    }

    async function togglePin(id) {
      const event = state.events.find((e) => e.id === id);
      if (!event) return;
      await runAction(() => updateDoc(doc(db, COL.events, id), stamp({ pinned: !event.pinned })), event.pinned ? 'Unpinned.' : 'Pinned to top.');
    }

       ===================================================================== */
    function memberRow(member = {}, locked = false) {
      return `
        <div class="member-row">
          <input class="input" name="member-name" placeholder="Full name" value="${esc(member.name || '')}" ${locked ? 'readonly' : ''} required>
          <input class="input" name="member-roll" placeholder="Roll number" value="${esc(member.rollNo || '')}" ${locked ? 'readonly' : ''} required style="text-transform:uppercase">
          ${locked
            ? `<span class="chip" title="Team leader" style="justify-content:center">Lead</span>`
            : `<button type="button" class="btn btn-ghost icon-btn" data-action="remove-member" aria-label="Remove member">${icon('close')}</button>`}
        </div>`;
    }

    function maxTeamSizeFor(event) {
      return Number(event?.teamSizeMax) || Number(state.settings.defaultMaxTeamSize) || 6;
    }

    function openTeamForm({ eventId, team = null }) {
      const emailRoll = rollFromEmail(state.user?.email);
      const userRoll = emailRoll || state.profile?.rollNo;
      if (!userRoll) return openProfileForm(true);
      const event = state.events.find((e) => e.id === eventId);
      if (!event) return toast('This event no longer exists.', 'error');
      const leaderName = state.profile?.displayName || cleanDisplayName(state.user?.displayName || '');
      const leader = { name: leaderName, rollNo: userRoll };
      const others = team ? (team.members || []).filter((m) => norm(m.rollNo) !== norm(leader.rollNo)) : [];
      const max = maxTeamSizeFor(event);

      const body = `
        <form id="team-form" data-form="team" data-event="${esc(eventId)}" data-id="${esc(team?.id || '')}" novalidate>
          <div class="form-grid">
            <div class="field"><label for="t-name">Team name <span class="req">*</span></label><input class="input" id="t-name" name="teamName" maxlength="80" required value="${esc(team?.teamName || '')}"></div>
            <div class="field"><label for="t-mentor">Faculty mentor</label><input class="input" id="t-mentor" name="mentor" value="${esc(team?.mentor || '')}"></div>
            <div class="field span-2">

    }

    function addMemberRow() {
      const rows = $('#member-rows');
      if (!rows) return;
      const max = Number(rows.dataset.max);
      if (rows.children.length >= max) return toast(`This event allows at most ${max} members.`, 'error');
      rows.insertAdjacentHTML('beforeend', memberRow());
      rows.lastElementChild.querySelector('input').focus();
    }

    async function submitTeamForm(form) {
      const errorEl = $('#team-form-error');
      const eventId = form.dataset.event;
      const teamId = form.dataset.id;
      const names = $$('[name="member-name"]', form).map((i) => i.value.trim());
      const rolls = $$('[name="member-roll"]', form).map((i) => i.value.trim().toUpperCase());
      const members = names.map((name, i) => ({ name, rollNo: rolls[i] })).filter((m) => m.name || m.rollNo);
      const teamName = form.elements.teamName.value.trim();

      const fail = (msg) => { errorEl.textContent = msg; };
      if (!teamName) return fail('Team name is required.');
      if (members.some((m) => !m.name || !m.rollNo)) return fail('Every member needs a name and roll number.');
      const rollSet = new Set(members.map((m) => m.rollNo));
      if (rollSet.size !== members.length) return fail('The same roll number appears twice.');

      const clash = state.teams.find((t) => t.eventId === eventId && t.id !== teamId && t.status !== 'rejected'
        && (t.members || []).some((m) => rollSet.has(String(m.rollNo).toUpperCase())));
      if (clash) {
        const who = (clash.members || []).find((m) => rollSet.has(String(m.rollNo).toUpperCase()));
        return fail(`${who.rollNo} is already in team "${clash.teamName}" for this event.`);
      }
      errorEl.textContent = '';

      const event = state.events.find((e) => e.id === eventId);
      const payload = { teamName, mentor: form.elements.mentor.value.trim(), members };
      const ok = await runAction(async () => {
        if (teamId) {
          await updateDoc(doc(db, COL.teams, teamId), stamp(payload));
        } else {
          await addDoc(collection(db, COL.teams), created({
            ...payload,
            eventId,
            eventName: event?.name || '',
            leaderUid: state.user.uid,
            leaderEmail: state.user.email,
            leaderName: state.profile.displayName,
            status: 'pending',
            result: '',
          }));
        }
      }, teamId ? 'Team updated.' : 'Team submitted for verification.');
      if (ok) modal.close();
    }

    async function deleteTeam(id) {
      const team = state.teams.find((t) => t.id === id);
      const confirmed = await confirmDialog({ title: 'Delete team registration?', text: `"${team?.teamName}" will be removed.`, confirmLabel: 'Delete', danger: true });
      if (!confirmed) return;
      await runAction(() => deleteDoc(doc(db, COL.teams, id)), 'Team removed.');
    }

    async function setTeamStatus(id, status) {

                    <td><div class="members">${(t.members || []).map((m) => `<div>${esc(m.name)} <span>${esc(m.rollNo)}</span></div>`).join('')}</div></td>
                    <td>${teamBadge(t.status)}</td>

                    <td><div class="actions">${mine ? `
                      <button class="btn btn-sm" data-action="edit-team" data-id="${esc(t.id)}">Edit</button>

                  </tr>`;

    let boardTimers = [];

    function stopBoardTimers() {
      boardTimers.forEach((t) => clearInterval(t));

    function renderBoardView() {
      if (!isAdmin()) {
        return `<div class="center-screen" style="min-height:60vh">
          <div class="card setup-card" style="text-align:center">

        </div>`;

    function updateBoardView() {
      const body = $('#board-body');
      if (!body) return;
      const sortBy = state.board.sortBy || 'default';
      const rows = enrichEvents()
        .filter((e) => e._year === state.board.year && (state.board.showCompleted || e._status !== 'completed'))
        .sort((a, b) => {
          if (sortBy === 'prize') {
            if (b._prizeValue !== a._prizeValue) return b._prizeValue - a._prizeValue;
            return (a._rank - b._rank) || (a.startDate || '').localeCompare(b.startDate || '');
          }
          if (sortBy === 'teams') {
            if (b._teams !== a._teams) return b._teams - a._teams;
            if (b._students !== a._students) return b._students - a._students;
            return (a._rank - b._rank) || (a.startDate || '').localeCompare(b.startDate || '');
          }
          if (sortBy === 'deadline') {
            const da = a.registrationDeadline || '9999-12-31';
            const db = b.registrationDeadline || '9999-12-31';
            if (da !== db) return da.localeCompare(db);
            return (a.startDate || '').localeCompare(b.startDate || '');
          }
          return (a._rank - b._rank) || (a.startDate || '').localeCompare(b.startDate || '');
        });
      if (!rows.length) {
        body.innerHTML = `<div style="padding:40px">${emptyState('No events for this year', 'Events added in the portal appear here automatically.')}</div>`;
        return;
      }
      body.innerHTML = `
        <table class="board-table">
          <thead>
            <tr>
              <th>S/No</th>
              <th>Event Name</th>
              <th>Organization</th>
              <th>Event Place</th>
              <th style="cursor:pointer;user-select:none" data-action="board-sort" data-sort="prize" title="Click to sort by Prize Money">
                Prize ${sortBy === 'prize' ? '▼' : '<span style="opacity:.35;font-weight:400">⇅</span>'}
              </th>

    function startBoardTimers() {
      stopBoardTimers();
      const clock = () => {
        const el = $('#board-clock');
        if (el) el.textContent = new Intl.DateTimeFormat('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date());
      };
      clock();
      boardTimers.push(setInterval(clock, 15000));

      // Slow auto-scroll for long lists on a TV; pauses at the ends and on hover.
      let pauseUntil = Date.now() + 4000;
      let hovering = false;
      const scroller = $('#board-scroll');
      scroller?.addEventListener('mouseenter', () => { hovering = true; });
      scroller?.addEventListener('mouseleave', () => { hovering = false; });
      boardTimers.push(setInterval(() => {
        const el = $('#board-scroll');
        if (!el || hovering || Date.now() < pauseUntil || window.matchMedia('(max-width: 860px)').matches) return;
        if (el.scrollHeight <= el.clientHeight) return;
        if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) {
          pauseUntil = Date.now() + 5000;
          setTimeout(() => { el.scrollTop = 0; pauseUntil = Date.now() + 4000; }, 4500);
          return;
        }
        el.scrollTop += 1;
      }, 40));
    }

    function timeAgo(date) {
      const minutes = Math.round((Date.now() - date.getTime()) / 60000);
      if (minutes < 1) return 'just now';
      if (minutes < 60) return `${plural(minutes, 'minute')} ago`;
      const hours = Math.round(minutes / 60);
      if (hours < 48) return `${plural(hours, 'hour')} ago`;
      return `${plural(Math.round(hours / 24), 'day')} ago`;
    }

    function renderImportStatus() {

        return `<p class="note" style="margin-bottom:18px">The automatic importer has not run yet. Run <strong>npm run import</strong> or start the "Import hackathons" GitHub Action.</p>`;
      }
      const finished = status.finishedAt?.toDate?.();
      const staleHours = Number(state.settings.importStaleHours) || 26;
      const stale = !finished || (Date.now() - finished.getTime()) / 3600000 > staleHours;
      const failing = (status.sources || []).filter((s) => !s.ok);
      const tone = failing.length || stale ? '' : 'info';
      const runLink = safeUrl(status.runUrl) ? ` · <a href="${esc(safeUrl(status.runUrl))}" target="_blank" rel="noopener noreferrer">View run</a>` : '';
      const sources = (status.sources || []).map((s) => `
        <span class="chip" title="${esc(s.error || `${s.fetched} fetched, ${s.kept} kept`)}" style="${s.ok ? '' : 'background:var(--marker-soft);color:var(--marker)'}">
          ${s.ok ? '✓' : '✕'} ${esc(s.label)} ${s.ok ? `<span class="num">${s.kept}</span>` : 'failed'}
        </span>`).join('');
      return `
        <div class="note ${tone}" style="margin-bottom:18px;display:grid;gap:8px">
          <div><strong>Last import ${finished ? esc(timeAgo(finished)) : 'time unknown'}</strong>${runLink}
            ${stale ? ` — <strong>no import in over ${staleHours} hours.</strong> Check the GitHub Action (GitHub pauses scheduled workflows after 60 days without repository activity).` : ''}
            ${failing.length ? ` — ${esc(failing.map((s) => `${s.label}: ${s.error}`).join('; '))}` : ''}</div>

      if (!email.endsWith(`@${state.settings.allowedDomain}`) && !allowedEmails.includes(email)) {
        return toast(`Use a @${state.settings.allowedDomain} or approved email address.`, 'error');

      await runAction(() => deleteDoc(doc(db, COL.roles, email)), 'Role removed.');

    async function submitSettingsForm(form) {
      const data = readFields(form, SETTINGS_FIELDS);
      const errorEl = $('#settings-form-error');
      const missing = SETTINGS_FIELDS.filter((f) => f.required && !f.readonly && (data[f.key] === '' || data[f.key] == null));
      if (missing.length) { errorEl.textContent = `Required: ${missing.map((f) => f.label).join(', ')}`; return; }

    async function submitProfileForm(form) {
      const emailRoll = rollFromEmail(state.user?.email);
      const data = {
        displayName: form.elements.displayName.value.trim(),
        rollNo: (emailRoll || form.elements.rollNo.value).trim().toUpperCase(),

        : { ...data, updatedAt: serverTimestamp() };
      if (state.profile?.isAdmin) payload.isAdmin = true;
      const ok = await runAction(() => (isNew
        ? setDoc(doc(db, COL.users, state.user.uid), payload)

    async function exportEvents() {
      const events = (state.route === 'events' ? filterEvents(enrichEvents()) : enrichEvents()).sort(compareEvents);
      if (!events.length) return toast('Nothing to export.', 'error');
      try {
        const XLSX = await import(SHEETJS_URL);
        const rows = events.map((e, i) => ({
          'S/No': i + 1,
          'Event Name': e.name,
          Organization: e.organizer || '',
          Mode: MODES[e.mode] || e.mode,
          City: e.city || '',
          State: e.state || '',
          Region: regionLabel(e._region),
          'Registration Deadline': e.registrationDeadline || '',
          'Start Date': e.startDate || '',
          'End Date': e.endDate || '',
          Status: STATUS[e._status].label,
          'Teams Registered': e._teams,
          'Number of Students': e._students,
          'Academic Year': e._year,
          'Registration Link': e.registrationUrl || '',
          Source: sourceLabel(e),
        }));
        const sheet = XLSX.utils.json_to_sheet(rows);
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, sheet, 'Events');
        const label = state.route === 'events' && state.filters.year ? state.filters.year : 'all';
        XLSX.writeFile(book, `${(state.settings.collegeShortName || 'college').toLowerCase()}-hackathons-${label}.xlsx`);
      } catch (error) {
        console.error(error);
        toast('Export failed. Check your internet connection.', 'error');
      }
    }

    /* =====================================================================
       18. ROUTER & RENDER
       ===================================================================== */
    const VIEWS = {
      events: { render: renderEventsView, update: updateEventsView },
      teams: { render: renderTeamsView },
      suggest: { render: renderSuggestView, update: updateSuggestView },
      board: { render: renderBoardView, update: updateBoardView, fullscreen: true },
      admin: { render: renderAdminView, keepOnUpdate: () => state.adminTab === 'settings' },   // don't wipe a half-edited settings form
    };

    let mountedKey = '';

    function readRoute() {
      const route = location.hash.replace(/^#\/?/, '').split('/')[0] || 'events';
      state.route = VIEWS[route] ? route : 'events';
    }

    function render() {
      const root = $('#app');
      let screen = '';
      if (state.fatalError) screen = 'fatal';
      else if (!state.config) screen = 'setup';
      else if (state.settingsMissing) screen = 'uninitialised';
      else if (!state.settings || !state.authReady) screen = 'loading';
      else if (!state.user) screen = 'signin';

      if (screen) {
        stopBoardTimers();
        mountedKey = screen;
        document.title = state.settings?.portalTitle || 'Hackathon Portal';
        if (screen === 'fatal') root.innerHTML = renderFatal();
        if (screen === 'setup') root.innerHTML = renderSetupScreen(state.setupMessage);
        if (screen === 'uninitialised') root.innerHTML = renderNotInitialised();
        if (screen === 'loading') root.innerHTML = '<div class="center-screen"><div class="spinner" role="status" aria-label="Loading"></div></div>';
        if (screen === 'signin') root.innerHTML = renderSignIn();
        return;
      }

      const view = VIEWS[state.route];
      const key = `app:${state.route}:${state.route === 'admin' ? state.adminTab : ''}:${state.role}:${state.loaded.events}`;
      const keep = typeof view.keepOnUpdate === 'function' ? view.keepOnUpdate() : view.keepOnUpdate;
      document.title = `${state.settings.portalTitle} · ${state.settings.collegeShortName || state.settings.collegeName}`;

      if (key !== mountedKey || (!keep && !view.update)) {
        const scrollY = key === mountedKey ? window.scrollY : 0;
        const active = document.activeElement;
        const focusSelector = active?.dataset?.filter ? `[data-filter="${active.dataset.filter}"]`
          : active?.dataset?.adminEvent ? `[data-admin-event="${active.dataset.adminEvent}"]` : '';
        const selection = focusSelector && active.type === 'search' ? [active.selectionStart, active.selectionEnd] : null;

        if (state.route === 'board') {
          if (!isAdmin()) {
            stopBoardTimers();
            root.innerHTML = renderShell(view.render());
          } else {
            root.innerHTML = view.render();
            if (key !== mountedKey) startBoardTimers();
          }
        } else {
          stopBoardTimers();
          root.innerHTML = renderShell(view.render());
        }
        mountedKey = key;
        window.scrollTo(0, scrollY);

        if (focusSelector) {
          const el = $(focusSelector);
          el?.focus();
          if (selection && el?.setSelectionRange) el.setSelectionRange(...selection);
        }
      }
      view.update?.();

      if (state.profile === null && !$('#profile-form')) openProfileForm(true);
    }

      'save-quick-config': () => {
        const raw = $('#quick-config-input')?.value || '';
        const errEl = $('#quick-config-err');
        try {
          let cleaned = raw.trim();
          if (cleaned.startsWith('const ') || cleaned.startsWith('var ') || cleaned.startsWith('let ')) {
            cleaned = cleaned.replace(/^(const|var|let)\s+\w+\s*=\s*/, '').replace(/;$/, '');
          }
          const jsonText = cleaned.replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g, '$1"$2":');
          const parsed = JSON.parse(jsonText);
          const fb = parsed.firebase || parsed;
          if (!fb.apiKey || !fb.projectId) throw new Error('Config is missing apiKey or projectId.');
          storage((s) => s.setItem('hp-firebase-config', JSON.stringify({ firebase: fb })));
          location.reload();
        } catch (err) {
          if (errEl) errEl.textContent = 'Invalid config format: ' + err.message;

    const forms = {
      event: submitEventForm,
      team: submitTeamForm,
      suggest: submitSuggestForm,
      profile: submitProfileForm,
      role: submitRoleForm,
      settings: submitSettingsForm,
    };

    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!e.target.closest('.user-menu')) $('#user-menu')?.classList.remove('open');
      if (!target) return;
      const handler = actions[target.dataset.action];
      if (handler) {
        if (target.tagName === 'A' && target.dataset.action !== 'open-event') e.preventDefault();
        handler(target, e);
      }
    });

    document.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) {
        e.preventDefault();
        e.target.click();
      }
    });

    document.addEventListener('submit', async (e) => {
      const form = e.target.closest('[data-form]');
      if (!form) return;
      e.preventDefault();
      const submitter = e.submitter || $(`[form="${form.id}"][type="submit"]`);
      if (submitter) submitter.disabled = true;
      try {
        await forms[form.dataset.form]?.(form);
      } finally {
        if (submitter) submitter.disabled = false;
      }
    });

    const onSearch = debounce(() => updateEventsView(), 150);
    const onAdminSearch = debounce(() => render(), 250);

    document.addEventListener('input', (e) => {
      if (e.target.dataset.filter === 'search') {
        state.filters.search = e.target.value;
        onSearch();
      } else if (e.target.dataset.adminEvent === 'search') {
        state.adminEventFilter.search = e.target.value;
        onAdminSearch();
      }
    });

    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.filter && el.dataset.filter !== 'search') {
        state.filters[el.dataset.filter] = el.value;
        updateEventsView();
      } else if (el.dataset.board) {
        state.board[el.dataset.board] = el.type === 'checkbox' ? el.checked : el.value;
        const title = $('.board-head h1');
        if (title && el.dataset.board === 'year') title.textContent = `Details of Hackathon / Project Competitions ${state.board.year}`;
        updateBoardView();
      } else if (el.dataset.teamFilter) {
        state.adminTeamFilter[el.dataset.teamFilter] = el.value;
        render();
      } else if (el.dataset.teamResult) {
        setTeamResult(el.dataset.teamResult, el.value);
      } else if (el.dataset.adminEvent && el.dataset.adminEvent !== 'search') {
        state.adminEventFilter[el.dataset.adminEvent] = el.type === 'checkbox' ? el.checked : el.value;
        render();
      }
    });

    $('#modal').addEventListener('cancel', (e) => { if (modal.locked) e.preventDefault(); });
    $('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) modal.close(); });

    window.addEventListener('hashchange', () => {
      readRoute();
      modal.close();
      render();
    });

    /* =====================================================================
       20. STORAGE HELPER
       ===================================================================== */
    function storage(fn) {
      try { return fn(window.localStorage); } catch { return null; }
    }

    /* =====================================================================
       21. BOOT
       ===================================================================== */
    async function boot() {
      document.documentElement.dataset.theme = 'light';
      document.documentElement.style.colorScheme = 'light';
      storage((s) => s.removeItem('hp-theme'));
      readRoute();

      try {
        state.config = await loadConfig();
      } catch (error) {
        state.setupMessage = error.message;
        render();
        return;
      }

      app = initializeApp(state.config.firebase);
      auth = getAuth(app);
      db = getFirestore(app);

      // Handle redirect sign-in results if returning from a redirect
      try {
        const redirectUser = await getRedirectResult(auth);
        if (redirectUser?.user) {
          console.log('Redirect sign-in completed for:', redirectUser.user.email);
        }
      } catch (redirectErr) {
        console.warn('Redirect sign-in error:', redirectErr);
        state.authError = redirectErr.message;
      }

      subscribe('settings', doc(db, COL.settings, SETTINGS_DOC), (snap) => {
        state.settingsMissing = !snap.exists();
        state.settings = snap.exists() ? snap.data() : null;
        mountedKey = '';
        render();
      }, (error) => {
        state.fatalError = error.code === 'permission-denied'
          ? 'The portal settings could not be read. Deploy the Firestore security rules (see README) and reload.'
          : `Could not load portal settings: ${error.message}`;
        render();
      });

      onAuthStateChanged(auth, async (user) => {
        resetSession();
        state.authReady = true;

        if (user) {
          if (!state.settings) {
            // Wait for settings to arrive before validating the domain.
            await new Promise((resolve) => {
              const check = setInterval(() => { if (state.settings || state.settingsMissing || state.fatalError) { clearInterval(check); resolve(); } }, 50);
            });
          }

          if (state.settingsMissing) {
            state.authError = 'Portal settings have not been seeded in Firestore yet. Run "node seed.mjs" inside scripts/ to initialize settings.';
            await signOut(auth);
            return;
          }

          const domain = state.settings?.allowedDomain;
          const email = (user.email || '').toLowerCase();
          const allowedEmails = (state.settings?.allowedEmails || []).map((e) => e.toLowerCase());
          const isAllowed = (domain && email.endsWith(`@${domain}`)) || allowedEmails.includes(email);
          if (!isAllowed || !user.emailVerified) {
            state.authError = `Only @${domain || 'college'} accounts or approved testers can use this portal. You signed in as ${email || 'an unknown account'}.`;
            await signOut(auth);
            return;
          }
          state.authError = '';
          state.user = user;
          startMemberSubscriptions();
        }
        mountedKey = '';
        render();
      });

      render();
    }

    boot().catch((error) => {
      console.error(error);
      state.fatalError = error.message;
      render();
    });
  </script>
</body>
</html>

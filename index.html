          'Event Name': e.name,
          Organization: e.organizer || '',
          Mode: MODES[e.mode] || e.mode,
          City: e.city || '',
          State: e.state || '',
          Region: regionLabel(e._region),
          'Registration Deadline': e.registrationDeadline || '',
          'Start Date': e.startDate || '',
          'End Date': e.endDate || '',
          Status: STATUS[e._status].label,
          'Teams Registered': e._teams,
          'Number of Students': e._students,
          'Academic Year': e._year,
          'Registration Link': e.registrationUrl || '',
          Source: sourceLabel(e),
        }));
        const sheet = XLSX.utils.json_to_sheet(rows);
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, sheet, 'Events');
        const label = state.route === 'events' && state.filters.year ? state.filters.year : 'all';
        XLSX.writeFile(book, `${(state.settings.collegeShortName || 'college').toLowerCase()}-hackathons-${label}.xlsx`);
      } catch (error) {
        console.error(error);
        toast('Export failed. Check your internet connection.', 'error');
      }
    }

    /* =====================================================================
       18. ROUTER & RENDER
       ===================================================================== */
    const VIEWS = {
      events: { render: renderEventsView, update: updateEventsView },
      teams: { render: renderTeamsView },
      suggest: { render: renderSuggestView, update: updateSuggestView },
      board: { render: renderBoardView, update: updateBoardView, fullscreen: true },
      admin: { render: renderAdminView, keepOnUpdate: () => state.adminTab === 'settings' },   // don't wipe a half-edited settings form
    };

    let mountedKey = '';

    function readRoute() {
      const route = location.hash.replace(/^#\/?/, '').split('/')[0] || 'events';
      state.route = VIEWS[route] ? route : 'events';
    }

    function render() {
      const root = $('#app');
      let screen = '';
      if (state.fatalError) screen = 'fatal';
      else if (!state.config) screen = 'setup';
      else if (state.settingsMissing) screen = 'uninitialised';
      else if (!state.settings || !state.authReady) screen = 'loading';
      else if (!state.user) screen = 'signin';

      if (screen) {
        stopBoardTimers();
        mountedKey = screen;
        document.title = state.settings?.portalTitle || 'Hackathon Portal';
        if (screen === 'fatal') root.innerHTML = renderFatal();
        if (screen === 'setup') root.innerHTML = renderSetupScreen(state.setupMessage);
        if (screen === 'uninitialised') root.innerHTML = renderNotInitialised();
        if (screen === 'loading') root.innerHTML = '<div class="center-screen"><div class="spinner" role="status" aria-label="Loading"></div></div>';
        if (screen === 'signin') root.innerHTML = renderSignIn();
        return;
      }

      const view = VIEWS[state.route];
      const key = `app:${state.route}:${state.route === 'admin' ? state.adminTab : ''}:${state.role}:${state.loaded.events}`;
      const keep = typeof view.keepOnUpdate === 'function' ? view.keepOnUpdate() : view.keepOnUpdate;
      document.title = `${state.settings.portalTitle} · ${state.settings.collegeShortName || state.settings.collegeName}`;

      if (key !== mountedKey || (!keep && !view.update)) {
        const scrollY = key === mountedKey ? window.scrollY : 0;
        const active = document.activeElement;
        const focusSelector = active?.dataset?.filter ? `[data-filter="${active.dataset.filter}"]`
          : active?.dataset?.adminEvent ? `[data-admin-event="${active.dataset.adminEvent}"]` : '';
        const selection = focusSelector && active.type === 'search' ? [active.selectionStart, active.selectionEnd] : null;

        if (state.route === 'board') {
          if (!isAdmin()) {
            stopBoardTimers();
            root.innerHTML = renderShell(view.render());
          } else {
            root.innerHTML = view.render();
            if (key !== mountedKey) startBoardTimers();
          }
        } else {
          stopBoardTimers();
          root.innerHTML = renderShell(view.render());
        }
        mountedKey = key;
        window.scrollTo(0, scrollY);

        if (focusSelector) {
          const el = $(focusSelector);
          el?.focus();
          if (selection && el?.setSelectionRange) el.setSelectionRange(...selection);
        }
      }
      view.update?.();

      if (state.profile === null && !$('#profile-form')) openProfileForm(true);
    }

    /* =====================================================================
       19. EVENT HANDLERS
       ===================================================================== */
    const actions = {
      'sign-in': () => signIn(),
      'sign-out': async () => { modal.close(true); await signOut(auth); },
      'save-quick-config': () => {
        const raw = $('#quick-config-input')?.value || '';
        const errEl = $('#quick-config-err');
        try {
          let cleaned = raw.trim();
          if (cleaned.startsWith('const ') || cleaned.startsWith('var ') || cleaned.startsWith('let ')) {
            cleaned = cleaned.replace(/^(const|var|let)\s+\w+\s*=\s*/, '').replace(/;$/, '');
          }
          const jsonText = cleaned.replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g, '$1"$2":');
          const parsed = JSON.parse(jsonText);
          const fb = parsed.firebase || parsed;
          if (!fb.apiKey || !fb.projectId) throw new Error('Config is missing apiKey or projectId.');
          storage((s) => s.setItem('hp-firebase-config', JSON.stringify({ firebase: fb })));
          location.reload();
        } catch (err) {
          if (errEl) errEl.textContent = 'Invalid config format: ' + err.message;
        }
      },
      'toggle-menu': () => $('#user-menu')?.classList.toggle('open'),
      'edit-profile': () => openProfileForm(false),
      'close-modal': () => modal.close(),
      'open-event': (el, e) => { e.preventDefault(); openEventDetail(el.dataset.id); },
      'new-event': () => openEventForm(),
      'edit-event': (el) => openEventForm({ event: state.events.find((e) => e.id === el.dataset.id) }),
      'delete-event': (el) => deleteEvent(el.dataset.id),
      'toggle-pin': (el) => togglePin(el.dataset.id),
      'register-team': (el) => openTeamForm({ eventId: el.dataset.id }),
      'edit-team': (el) => {
        const team = state.teams.find((t) => t.id === el.dataset.id);
        if (team) openTeamForm({ eventId: team.eventId, team });
      },
      'delete-team': (el) => deleteTeam(el.dataset.id),
      'verify-team': (el) => setTeamStatus(el.dataset.id, 'verified'),
      'reject-team': (el) => setTeamStatus(el.dataset.id, 'rejected'),
      'add-member': () => addMemberRow(),
      'remove-member': (el) => el.closest('.member-row')?.remove(),
      'set-region': (el) => { state.filters.region = el.dataset.region; updateEventsView(); },
      'admin-tab': (el) => { state.adminTab = el.dataset.tab; render(); },
      'approve-suggestion': (el) => reviewSuggestion(el.dataset.id),
      'reject-suggestion': (el) => rejectSuggestion(el.dataset.id),
      'set-visibility': (el) => setVisibility([el.dataset.id], el.dataset.visibility),
      'publish-all': () => publishAllPending(),
      'review-import': (el) => openEventForm({ event: state.events.find((e) => e.id === el.dataset.id), publishOnSave: true }),
      'remove-role': (el) => removeRole(el.dataset.id),
      'export-events': () => exportEvents(),
      'board-fullscreen': () => $('#board')?.requestFullscreen?.(),
      'board-sort': (el) => {
        const target = el.dataset.sort;
        state.board.sortBy = state.board.sortBy === target ? 'default' : target;
        const select = $('select[data-board="sortBy"]');
        if (select) select.value = state.board.sortBy;
        updateBoardView();
      },
      'share-whatsapp': (el, e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        shareToWhatsApp(el.dataset.id);
      },
    };

    const forms = {
      event: submitEventForm,
      team: submitTeamForm,
      suggest: submitSuggestForm,
      profile: submitProfileForm,
      role: submitRoleForm,
      settings: submitSettingsForm,
    };

    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!e.target.closest('.user-menu')) $('#user-menu')?.classList.remove('open');
      if (!target) return;
      const handler = actions[target.dataset.action];
      if (handler) {
        if (target.tagName === 'A' && target.dataset.action !== 'open-event') e.preventDefault();
        handler(target, e);
      }
    });

    document.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) {
        e.preventDefault();
        e.target.click();
      }
    });

    document.addEventListener('submit', async (e) => {
      const form = e.target.closest('[data-form]');
      if (!form) return;
      e.preventDefault();
      const submitter = e.submitter || $(`[form="${form.id}"][type="submit"]`);
      if (submitter) submitter.disabled = true;
      try {
        await forms[form.dataset.form]?.(form);
      } finally {
        if (submitter) submitter.disabled = false;
      }
    });

    const onSearch = debounce(() => updateEventsView(), 150);
    const onAdminSearch = debounce(() => render(), 250);

    document.addEventListener('input', (e) => {
      if (e.target.dataset.filter === 'search') {
        state.filters.search = e.target.value;
        onSearch();
      } else if (e.target.dataset.adminEvent === 'search') {
        state.adminEventFilter.search = e.target.value;
        onAdminSearch();
      }
    });

    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.filter && el.dataset.filter !== 'search') {
        state.filters[el.dataset.filter] = el.value;
        updateEventsView();
      } else if (el.dataset.board) {
        state.board[el.dataset.board] = el.type === 'checkbox' ? el.checked : el.value;
        const title = $('.board-head h1');
        if (title && el.dataset.board === 'year') title.textContent = `Details of Hackathon / Project Competitions ${state.board.year}`;
        updateBoardView();
      } else if (el.dataset.teamFilter) {
        state.adminTeamFilter[el.dataset.teamFilter] = el.value;
        render();
      } else if (el.dataset.teamResult) {
        setTeamResult(el.dataset.teamResult, el.value);
      } else if (el.dataset.adminEvent && el.dataset.adminEvent !== 'search') {
        state.adminEventFilter[el.dataset.adminEvent] = el.type === 'checkbox' ? el.checked : el.value;
        render();
      }
    });

    $('#modal').addEventListener('cancel', (e) => { if (modal.locked) e.preventDefault(); });
    $('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) modal.close(); });

    window.addEventListener('hashchange', () => {
      readRoute();
      modal.close();
      render();
    });

    /* =====================================================================
       20. STORAGE HELPER
       ===================================================================== */
    function storage(fn) {
      try { return fn(window.localStorage); } catch { return null; }
    }

    /* =====================================================================
       21. BOOT
       ===================================================================== */
    async function boot() {
      document.documentElement.dataset.theme = 'light';
      document.documentElement.style.colorScheme = 'light';
      storage((s) => s.removeItem('hp-theme'));
      readRoute();

      try {
        state.config = await loadConfig();
      } catch (error) {
        state.setupMessage = error.message;
        render();
        return;
      }

      app = initializeApp(state.config.firebase);
      auth = getAuth(app);
      db = getFirestore(app);

      // Handle redirect sign-in results if returning from a redirect
      try {
        const redirectUser = await getRedirectResult(auth);
        if (redirectUser?.user) {
          console.log('Redirect sign-in completed for:', redirectUser.user.email);
        }
      } catch (redirectErr) {
        console.warn('Redirect sign-in error:', redirectErr);
        state.authError = redirectErr.message;
      }

      subscribe('settings', doc(db, COL.settings, SETTINGS_DOC), (snap) => {
        state.settingsMissing = !snap.exists();
        state.settings = snap.exists() ? snap.data() : null;
        mountedKey = '';
        render();
      }, (error) => {
        state.fatalError = error.code === 'permission-denied'
          ? 'The portal settings could not be read. Deploy the Firestore security rules (see README) and reload.'
          : `Could not load portal settings: ${error.message}`;
        render();
      });

      onAuthStateChanged(auth, async (user) => {
        resetSession();
        state.authReady = true;

        if (user) {
          if (!state.settings) {
            // Wait for settings to arrive before validating the domain.
            await new Promise((resolve) => {
              const check = setInterval(() => { if (state.settings || state.settingsMissing || state.fatalError) { clearInterval(check); resolve(); } }, 50);
            });
          }

          if (state.settingsMissing) {
            state.authError = 'Portal settings have not been seeded in Firestore yet. Run "node seed.mjs" inside scripts/ to initialize settings.';
            await signOut(auth);
            return;
          }

          const domain = state.settings?.allowedDomain;
          const email = (user.email || '').toLowerCase();
          const allowedEmails = (state.settings?.allowedEmails || []).map((e) => e.toLowerCase());
          const isAllowed = (domain && email.endsWith(`@${domain}`)) || allowedEmails.includes(email);
          if (!isAllowed || !user.emailVerified) {
            state.authError = `Only @${domain || 'college'} accounts or approved testers can use this portal. You signed in as ${email || 'an unknown account'}.`;
            await signOut(auth);
            return;
          }
          state.authError = '';
          state.user = user;
          startMemberSubscriptions();
        }
        mountedKey = '';
        render();
      });

      render();
    }

    boot().catch((error) => {
      console.error(error);
      state.fatalError = error.message;
      render();
    });
  </script>
</body>
</html>
